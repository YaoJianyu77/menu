name: Deploy recipe catalog to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Check formatting, lint, and tests
        run: |
          ruff format --check recipe_system tests scripts
          ruff check recipe_system tests scripts
          node --check site/catalog.js
          node --check site/hidden.js
          python -m pytest -q
      - name: Build from persisted recipe data
        run: |
          python -m recipe_system.cli publish
          python -m recipe_system.cli build
          python -m recipe_system.cli validate
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
