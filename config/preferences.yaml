preferences:
  prefer_common_ingredients: true
  prefer_reusable_ingredients: true
  prefer_low_cleanup: true
  prefer_batch_cooking: true
  prefer_one_pan: true
  prefer_sheet_pan: true
  prefer_air_fryer: true
  prefer_simple_oven: true
  prefer_stovetop_simple: true
nutrition:
